[build]
  command = "bash scripts/build-piston-train-toy.sh"
  publish = "examples/piston-train-toy/build"

[build.environment]
  NODE_VERSION = "22.17.1"
  # Used by scripts/prepare-natural-data.sh venv (not Netlify's auto pip — root
  # ML deps live in requirements-ml.txt so Netlify does not install torch/numpy).
  PYTHON_VERSION = "3.12"
  # Optional: narrow datasets if build limits are hit, e.g. DATASETS=tinyshakespeare,tinystories
  # Optional: SKIP_WASM=1 / FORCE_WASM=1 (see scripts/build-piston-train-toy.sh)

# Persist Rust/WASM + dataset artifacts across deploys so fingerprint skip can hit.
# Requires netlify-plugin-cache in package.json (root). In the Netlify UI, leave
# "Package directory" empty / repo root — not packages/example-common.
#
# Do NOT cache `.cargo/git` (EISDIR on LICENSE-* paths) or `.cargo/registry`
# (netlify-plugin-cache/cpy can restore truncated crate trees → rustc E0583
# "file not found for module `arch`" in memchr etc.). Cache `target` +
# `.cargo/bin` (installed wasm-bindgen) only; crates.io re-downloads on miss.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [
    "target",
    ".cargo/bin",
    ".cache/browser-train-data",
    "examples/piston-train-toy/static/tokenizer",
    "examples/piston-train-toy/static/tokenized"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
